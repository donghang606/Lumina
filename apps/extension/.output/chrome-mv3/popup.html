      header { padding: 12px 16px; border-bottom: 1px solid #f2f3f5; display: flex; align-items: center; gap: 8px; }

      button.ghost { background: #f2f3f5; color: #1f2329; }
      button:disabled { opacity: 0.5; cursor: default; }

      .done .icon { font-size: 40px; }
